name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 请描述当前使用中遇到的不便。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请描述你希望 App 怎么做。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及功能区域
      options:
        - 推送渠道
        - 软件选择
        - 模板
        - 规则
        - 电话 / SIM
        - 记录
        - 备份恢复
        - UI / 交互
        - 文档
        - 其他
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代方法
  - type: textarea
    id: notes
    attributes:
      label: 其他补充
      description: 请不要提交 Token、Webhook、完整号码或验证码。
