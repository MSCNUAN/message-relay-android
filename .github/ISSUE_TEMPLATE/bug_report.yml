name: Bug 反馈
description: 报告消息接力的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先移除 Token、Webhook、完整电话号码、验证码和完整通知正文。
  - type: input
    id: device
    attributes:
      label: 手机品牌和型号
      placeholder: 例如：HONOR / Xiaomi / Pixel，具体型号
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android 版本
      placeholder: 例如：Android 14
    validations:
      required: true
  - type: input
    id: rom
    attributes:
      label: 厂商系统版本
      placeholder: 例如：MagicOS / MIUI / ColorOS 版本
    validations:
      required: true
  - type: dropdown
    id: sim
    attributes:
      label: SIM 状态
      options:
        - 单卡
        - 双卡
        - eSIM
        - 无 SIM / 模拟器
        - 不确定
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: 应用版本
      placeholder: 例如：0.1.3
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按 1、2、3 写清楚如何复现。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: dropdown
    id: screen_off
    attributes:
      label: 是否开启仅息屏时推送
      options:
        - 否
        - 是
        - 不确定
    validations:
      required: true
  - type: dropdown
    id: quiet_hours
    attributes:
      label: 是否开启免打扰
      options:
        - 否
        - 是
        - 不确定
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志
      description: 不要粘贴完整 Token、Webhook、号码、验证码或完整通知正文。
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: 截图
      description: 可粘贴截图，但请遮挡敏感内容。
